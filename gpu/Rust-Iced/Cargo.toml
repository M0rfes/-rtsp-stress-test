[package]
name = "rtsp-stress-test-iced-gpu"
version = "1.0.0"
description = "6-Hour 30-stream 1440p 25fps RTSP Video Grid Benchmark (Rust Iced GPU Zero-Copy Hardware Decode)"
edition = "2021"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "advanced", "image", "tokio", "crisp", "x11", "wayland"] }
iced_wgpu = "0.14"
wgpu = { version = "27", features = ["gles", "vulkan", "metal", "dx12"] }
wgpu-hal = "27"
glow = "0.16"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-gl = "0.25"
gstreamer-video = "0.25"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
bytes = "1"
log = "0.4"
env_logger = "0.11"
arc-swap = "1.7"
bytemuck = { version = "1", features = ["derive"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Foundation",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
