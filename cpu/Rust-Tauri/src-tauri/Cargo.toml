[package]
name = "rtsp-stress-test-tauri-cpu"
version = "1.0.0"
description = "6-Hour 30-stream 1440p 25fps RTSP Video Grid Benchmark (Rust Tauri CPU Software Decode)"
edition = "2021"

[lib]
name = "rtsp_stress_test_tauri_cpu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gstreamer = "0.25"
gstreamer-app = "0.25"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
bytes = "1"
log = "0.4"
env_logger = "0.11"
